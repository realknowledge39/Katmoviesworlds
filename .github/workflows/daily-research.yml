name: Daily entertainment research digest

on:
  workflow_dispatch:
  schedule:
    - cron: '30 3 * * *' # 09:00 IST

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run adapter tests
        run: python -m unittest discover -s tests -v
      - name: Collect RSS research digest
        run: python scripts/build_digest.py
      - name: Commit research drafts
        run: |
          if [[ -n "$(git status --porcelain content/drafts)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add content/drafts
            git commit -m "Add daily entertainment research digest"
            git push
          else
            echo "No new draft files."
          fi
